# ============================================================
#  CG GOVT JOB ALERT - SETTINGS
#  Is file mein badlav karke aap alerts control kar sakte ho.
#  Naya keyword jodna ho to bas uski list mein "- keyword" likh do.
#  (Har line ki shuruaat mein spaces aur "- " ka dhyan rakhna)
